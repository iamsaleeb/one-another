name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to deploy (e.g. v0.9.0)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - preview
          - production

env:
  NODE_VERSION: '20'

jobs:
  migrate:
    name: Run migrations (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Pull env from Vercel
        run: |
          npm install -g vercel@53.3.1
          vercel env pull .env.local --environment=${{ inputs.environment }} --token=$VERCEL_TOKEN --yes
          set -a && source .env.local && set +a
          DATABASE_URL="${DATABASE_URL:-${POSTGRES_URL:-$PRISMA_DATABASE_URL}}"
          echo "DATABASE_URL=$DATABASE_URL" >> $GITHUB_ENV
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Deploy migrations
        run: npx prisma migrate deploy

  deploy:
    name: Deploy to Vercel (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: migrate
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Deploy to Vercel
        id: vercel-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@53.3.1
          if [ "${{ inputs.environment }}" = "production" ]; then
            DEPLOY_OUTPUT=$(vercel deploy --prod --token="$VERCEL_TOKEN" 2>&1)
            DEPLOY_EXIT=$?
          else
            DEPLOY_OUTPUT=$(vercel deploy --token="$VERCEL_TOKEN" 2>&1)
            DEPLOY_EXIT=$?
          fi
          if [ $DEPLOY_EXIT -ne 0 ]; then
            echo "::error::Vercel deployment failed (exit $DEPLOY_EXIT)"
            echo "$DEPLOY_OUTPUT"
            exit $DEPLOY_EXIT
          fi
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | tail -1)
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
      - name: Deployment summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL**: ${{ steps.vercel-deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
