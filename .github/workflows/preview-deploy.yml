name: Preview Deploy

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

# Cancel previous run on same PR when a new commit is pushed
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: TypeScript type check
        run: npx tsc --noEmit

  test:
    name: Test (coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          AUTH_SECRET: ci-test-secret-not-real
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  deploy:
    name: Deploy preview
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Install Vercel CLI
        run: npm install -g vercel@53.3.1

      - name: Wipe and reseed preview database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx prisma migrate reset --force
          npx ts-node --compiler-options '{"module":"CommonJS"}' prisma/seed.ts

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOY_OUTPUT=$(vercel deploy --token="$VERCEL_TOKEN" 2>&1)
          DEPLOY_EXIT=$?
          if [ $DEPLOY_EXIT -ne 0 ]; then
            echo "::error::Vercel deployment failed (exit $DEPLOY_EXIT)"
            echo "$DEPLOY_OUTPUT"
            exit $DEPLOY_EXIT
          fi
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -1)
          {
            echo "url<<EOF"
            echo "$DEPLOY_URL"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          cat > /tmp/comment.md << 'COMMENT'
          ### Preview deployed

          $PREVIEW_URL

          <details>
          <summary>Test accounts &mdash; password: <code>password123</code></summary>

          | Role | Name | Email |
          |------|------|-------|
          | Attendee | Mark Girgis | user@example.com |
          | Organiser | Fr. Bishoy Lamie | organiser1@example.com |
          | Organiser | Deacon Mina Nashed | organiser2@example.com |
          | Organiser | Fr. Antonious Farag | organiser3@example.com |
          | Admin | Carol Admin | admin@example.com |

          </details>
          COMMENT

          # Expand $PREVIEW_URL in the file
          sed -i "s|\$PREVIEW_URL|${PREVIEW_URL}|g" /tmp/comment.md

          # Find existing preview comment by marker and update it, or create new
          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.body | contains("### Preview deployed"))] | last | .id // empty')

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" \
              --method PATCH \
              --field body="$(cat /tmp/comment.md)"
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/comment.md
          fi
