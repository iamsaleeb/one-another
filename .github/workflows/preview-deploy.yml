name: Preview Deploy

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

# Cancel previous run on same PR when a new commit is pushed
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: TypeScript type check
        run: npx tsc --noEmit

  test:
    name: Test (coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          AUTH_SECRET: ci-test-secret-not-real
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  deploy:
    name: Deploy preview
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Install Vercel CLI
        run: npm install -g vercel@53.3.1

      - name: Pull env from Vercel
        run: |
          vercel env pull .env.local --environment=preview --token=$VERCEL_TOKEN --yes
          echo "=== .env.local content (first 30 lines, cat -A) ==="
          head -30 .env.local | cat -A || true
          echo "==================================================="
          DATABASE_URL=$(node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('.env.local');
            // Strip UTF-8 BOM if present, handle any encoding
            const content = raw.toString('utf8').replace(/^﻿/, '');
            const lines = content.split(/\r?\n/);
            for (const line of lines) {
              const m = line.match(/^(DATABASE_URL|POSTGRES_URL|PRISMA_DATABASE_URL)=(.*)/);
              if (m) { process.stdout.write(m[2].replace(/^\"|\"$/g, '').trim()); break; }
            }
          ")
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Could not extract DATABASE_URL from Vercel env pull output"
            exit 1
          fi
          echo "DATABASE_URL=$DATABASE_URL" >> $GITHUB_ENV
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Assert DATABASE_URL is not production
        run: |
          if echo "$DATABASE_URL" | grep -qiE "prod[^a-z]|production"; then
            echo "ERROR: DATABASE_URL appears to be a production database. Aborting." >&2
            exit 1
          fi

      - name: Wipe and reseed preview database
        run: |
          npx prisma migrate reset --force
          npx ts-node --compiler-options '{"module":"CommonJS"}' prisma/seed.ts

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOY_OUTPUT=$(vercel deploy --token="$VERCEL_TOKEN" 2>&1)
          DEPLOY_EXIT=$?
          if [ $DEPLOY_EXIT -ne 0 ]; then
            echo "::error::Vercel deployment failed (exit $DEPLOY_EXIT)"
            echo "$DEPLOY_OUTPUT"
            exit $DEPLOY_EXIT
          fi
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | tail -1)
          {
            echo "url<<EOF"
            echo "$DEPLOY_URL"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          cat > /tmp/comment.md << EOF
          ### Preview deployed

          ${PREVIEW_URL}

          <details>
          <summary>Test accounts &mdash; password: <code>password123</code></summary>

          | Role | Name | Email |
          |------|------|-------|
          | Attendee | Mark Girgis | user@example.com |
          | Organiser | Fr. Bishoy Lamie | organiser1@example.com |
          | Organiser | Deacon Mina Nashed | organiser2@example.com |
          | Organiser | Fr. Antonious Farag | organiser3@example.com |
          | Admin | Carol Admin | admin@example.com |

          </details>
          EOF
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file /tmp/comment.md \
            --edit-last || \
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file /tmp/comment.md
